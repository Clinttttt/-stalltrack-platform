<div class="p-shell">
  <header class="p-paper px-5 pb-6 pt-6">
    <div class="flex items-center gap-3">
      <img src="/brand/stalltrack-seal.png" alt="" class="h-12 w-12 shrink-0 object-contain" />
      <div class="leading-tight">
        <p class="font-display text-2xl font-bold text-civic-deep">StallTrack</p>
        <p class="text-sm text-muted">Payor Portal</p>
      </div>
    </div>
  </header>

  <main class="flex-1 px-5 py-6">
    <section class="rounded-2xl border border-tint-line bg-white p-6 shadow-card">
      <p class="p-eyebrow">First-time access <span class="h-px w-12 bg-civic-deep/40" aria-hidden="true"></span></p>
      <h1 class="mt-2 font-display text-[2rem] font-bold leading-tight text-civic-deep">Activate your account</h1>
      <p class="mt-1 text-sm text-muted">
        Use the one-time code on your bill and the contact number on file.
      </p>

      <form class="mt-6 flex flex-col gap-4" (ngSubmit)="submit()">
        <label class="flex flex-col gap-1.5">
          <span class="p-label">Activation code</span>
          <input class="p-input uppercase"
                 type="text" autocomplete="one-time-code" placeholder="XXXX-XXXX"
                 name="activationCode" [(ngModel)]="activationCode" [disabled]="busy()" />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="p-label">Registered mobile no.</span>
          <input class="p-input"
                 type="tel" inputmode="tel" autocomplete="username" placeholder="09xx xxx xxxx"
                 name="contactNumber" [(ngModel)]="contactNumber" [disabled]="busy()" />
        </label>

        <hr class="border-line" />

        <label class="flex flex-col gap-1.5">
          <span class="p-label">Create password</span>
          <span class="relative flex items-center">
            <input class="w-full p-input pr-11"
                   [type]="revealed() ? 'text' : 'password'" autocomplete="new-password"
                   placeholder="At least 8 characters" name="password" [(ngModel)]="password" [disabled]="busy()" />
            <button class="absolute right-3 rounded p-1 text-muted transition hover:text-civic-panel" type="button" (click)="reveal()"
                    [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </span>
        </label>

        @if (error()) {
          <p class="rounded-xl bg-red-bg px-4 py-3 text-sm text-red">{{ error() }}</p>
        }

        <button class="p-btn mt-2 w-full"
                type="submit" [disabled]="busy() || !ready()">
          {{ busy() ? 'Activating…' : 'Activate & Continue' }}
        </button>
      </form>

      <p class="mt-5 text-center text-sm text-muted">
        Already activated?
        <a class="font-semibold text-civic" routerLink="/login">Sign in</a>
      </p>
    </section>
  </main>
</div>
