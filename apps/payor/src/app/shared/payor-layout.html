<div class="p-shell">
  <!-- The office's own identity, as it appears on its printed documents: seal, office name above the municipality,
       and the portal's name. Loaded from the signed-in payor's account, since one address serves every LGU here. -->
  <header class="p-paper px-5 pb-4 pt-5">
    <div class="flex items-center gap-3">
      @if (branding.sealUrl()) {
        <img class="h-11 w-11 shrink-0 rounded-full border border-tint-line bg-white object-contain p-0.5 shadow-soft" [src]="branding.sealUrl()"
             [alt]="branding.municipality() + ' seal'" />
      }
      <div class="min-w-0">
        <p class="truncate text-[10px] font-semibold uppercase tracking-[0.18em] text-muted">
          {{ eyebrow() }}
        </p>
        <p class="font-display text-xl font-bold leading-tight text-civic-deep">Payor Portal</p>
      </div>
      <a class="relative ml-auto flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-civic-deep"
         routerLink="/notifications" [attr.aria-label]="unread() > 0 ? 'Notifications, ' + unread() + ' unread' : 'Notifications'">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        @if (unread() > 0) {
          <span class="absolute right-0 top-0 min-w-4 rounded-full bg-civic-panel px-1 text-center text-[10px] font-semibold leading-4 text-white">{{ unread() }}</span>
        }
      </a>
    </div>
  </header>

  <main class="flex-1 px-5 pb-8">
    <ng-content />
  </main>

  <!-- What the payor holds, what they owe, what they have paid, and their own details. -->
  <nav class="sticky bottom-0 grid grid-cols-4 border-t border-line bg-white/95 backdrop-blur">
    <a class="flex flex-col items-center gap-1 py-3 text-[11px] font-semibold text-muted" routerLink="/"
       routerLinkActive="text-civic-panel" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      Accounts
    </a>
    <a class="flex flex-col items-center gap-1 py-3 text-[11px] font-semibold text-muted" routerLink="/balances"
       routerLinkActive="text-civic-panel">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2" />
        <line x1="2" y1="10" x2="22" y2="10" />
      </svg>
      Balances
    </a>
    <a class="flex flex-col items-center gap-1 py-3 text-[11px] font-semibold text-muted" routerLink="/history"
       routerLinkActive="text-civic-panel">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
      History
    </a>
    <a class="flex flex-col items-center gap-1 py-3 text-[11px] font-semibold text-muted" routerLink="/profile"
       routerLinkActive="text-civic-panel">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      Profile
    </a>
  </nav>
</div>
