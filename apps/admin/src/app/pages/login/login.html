<app-auth-shell>
  <div class="auth-eyebrow">Platform access <span class="h-px w-16 bg-civic-deep/50" aria-hidden="true"></span></div>
  <h1 class="auth-title">Sign in</h1>
  <p class="mt-2 text-base text-muted">StallTrack Platform Admin</p>

  <form (ngSubmit)="submit($event)" class="mt-9 space-y-5">
    <div>
      <label class="auth-label" for="username">Username</label>
      <div class="auth-field mt-2">
        <app-icon name="user" className="h-5 w-5 text-muted" />
        <input
          id="username"
          type="text"
          name="username"
          autocomplete="username"
          [(ngModel)]="username"
          class="w-full bg-transparent text-[15px] text-ink outline-none"
          required
        />
      </div>
    </div>

    <div>
      <div class="flex items-baseline justify-between">
        <label class="auth-label" for="password">Password</label>
        <a routerLink="/forgot-password" class="text-sm font-medium text-civic underline-offset-4 hover:underline">Forgot password?</a>
      </div>
      <div class="auth-field mt-2">
        <app-icon name="lock" className="h-5 w-5 text-muted" />
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          class="w-full bg-transparent text-[15px] text-ink outline-none"
          required
        />
      </div>
    </div>

    @if (error()) {
      <div class="a-note-danger flex items-start gap-2" role="alert">
        <app-icon name="x" className="mt-0.5 h-4 w-4 shrink-0" />
        <span>{{ error() }}</span>
      </div>
    }

    <button type="submit" [disabled]="busy()" class="a-btn-primary relative !mt-7 h-14 w-full text-base">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
      <app-icon name="arrowRight" className="absolute right-6 top-1/2 h-5 w-5 -translate-y-1/2" />
    </button>
  </form>
</app-auth-shell>
