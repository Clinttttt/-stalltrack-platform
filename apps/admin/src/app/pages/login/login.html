<app-auth-shell>
  <h1 class="font-display text-3xl font-bold text-ink">Sign in</h1>
  <p class="mt-1.5 text-sm text-muted">Platform operator access.</p>

  <form (ngSubmit)="submit()" class="mt-7 space-y-4">
    <div>
      <label class="a-label" for="username">Username</label>
      <div class="a-field mt-1.5">
        <app-icon name="user" className="h-4 w-4 text-muted" />
        <input
          id="username"
          type="text"
          name="username"
          autocomplete="username"
          [(ngModel)]="username"
          class="w-full bg-transparent py-2.5 text-sm text-ink outline-none"
          required
        />
      </div>
    </div>

    <div>
      <div class="flex items-baseline justify-between">
        <label class="a-label" for="password">Password</label>
        <a routerLink="/forgot-password" class="text-xs font-semibold text-civic hover:underline">Forgot password?</a>
      </div>
      <div class="a-field mt-1.5">
        <app-icon name="lock" className="h-4 w-4 text-muted" />
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          class="w-full bg-transparent py-2.5 text-sm text-ink outline-none"
          required
        />
      </div>
    </div>

    @if (error()) {
      <div class="a-note-danger flex items-start gap-2" role="alert">
        <app-icon name="x" className="mt-0.5 h-4 w-4 shrink-0" />
        <span>{{ error() }}</span>
      </div>
    }

    <button type="submit" [disabled]="busy()" class="a-btn-primary w-full !py-3">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</app-auth-shell>
