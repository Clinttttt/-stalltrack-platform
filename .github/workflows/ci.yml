name: CI

# Mirrors the EEMO repository's CI: every push and pull request to main must build cleanly and pass its specs before it
# can be deployed. The production build is the first gate - Angular's strict template checking catches a surprising
# amount - and the unit specs are the second, because the two Angular apps now hold a session, a shared token refresh
# and the arithmetic behind a fish day, and none of those can be judged by a build succeeding.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an in-flight check for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 / npm 11 is the toolchain that generated package-lock.json (lockfileVersion 3).
          # Node 22 ships npm 10, which resolves nx's nested yaml dependency differently and fails
          # "npm ci" with a false "Missing: yaml@2.9.0 from lock file".
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        run: npx nx build admin

      # Built on every push like the console, so the portal cannot rot while its screens are being written.
      - name: Build payor portal
        run: npx nx build payor

      # Run for BOTH apps by name rather than by what changed, so a spec cannot go unrun because the commit touching it
      # looked unrelated to the graph. A spec nobody runs is documentation, and the payor portal handles money.
      - name: Run unit specs
        run: npx nx run-many -t test --projects=admin,payor --parallel=1

      # The landing site pulls the municipality registry first (the same script Vercel runs), so a broken
      # sync script is caught here rather than at deploy time.
      - name: Build landing site
        run: npm run build:landing

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          # Angular's application builder emits the servable site under browser/.
          path: dist/apps/admin/browser
          if-no-files-found: error
          retention-days: 7
