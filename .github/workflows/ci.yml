name: CI

# Mirrors the EEMO repository's CI: every push and pull request to main must build cleanly before it can be
# deployed. Kept deliberately simple - this repo has no test suite yet, so the production build IS the gate
# (Angular's strict template checking catches a surprising amount).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an in-flight check for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 / npm 11 is the toolchain that generated package-lock.json (lockfileVersion 3).
          # Node 22 ships npm 10, which resolves nx's nested yaml dependency differently and fails
          # "npm ci" with a false "Missing: yaml@2.9.0 from lock file".
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        run: npx nx build admin

      # The landing site pulls the municipality registry first (the same script Vercel runs), so a broken
      # sync script is caught here rather than at deploy time.
      - name: Build landing site
        run: npm run build:landing

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          # Angular's application builder emits the servable site under browser/.
          path: dist/apps/admin/browser
          if-no-files-found: error
          retention-days: 7
